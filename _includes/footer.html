<footer class="site-footer">
  <div class="wrap footer-inner">
    <p class="copy">© {{ 'now' | date: '%Y' }} {{ site.author.name }}.</p>
    <p class="links">
      {% if site.links.email %}<a href="mailto:{{ site.links.email }}">Email</a>{% endif %}
      {% if site.links.scholar %} · <a href="{{ site.links.scholar }}">Scholar</a>{% endif %}
      {% if site.links.github %} · <a href="https://github.com/{{ site.links.github }}">GitHub</a>{% endif %}
      {% if site.links.orcid %} · <a href="https://orcid.org/{{ site.links.orcid }}">ORCID</a>{% endif %}
      {% if site.links.linkedin %} · <a href="https://linkedin.com/in/{{ site.links.linkedin }}">LinkedIn</a>{% endif %}
    </p>
  </div>
</footer>
